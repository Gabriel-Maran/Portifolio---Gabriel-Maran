# Atualizações semanais das dependências e das actions do CI, sempre por pull request.
# A espera de 7 dias é a mesma do min-release-age do .npmrc: uma versão recém-publicada ainda
# pode ser retirada ou estar comprometida. Os alertas de segurança não esperam.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    # Mensagens no padrão do projeto: "chore(deps): ..." e "chore(deps-dev): ...".
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Versões menores e correções chegam num PR só; uma versão major continua em PR próprio.
      minor-and-patch:
        update-types: [minor, patch]

  # As actions estão fixadas por SHA no ci.yml; o Dependabot troca o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Todas as actions num PR só, para o CI ser atualizado de uma vez.
      actions:
        patterns: ['*']
