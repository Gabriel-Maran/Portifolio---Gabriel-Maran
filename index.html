<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Gabriel Maran · Desenvolvedor Full Stack</title>
    <meta
      name="description"
      content="Gabriel Maran, Desenvolvedor Full Stack Júnior no Grupo Ítalo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Prévia do link no LinkedIn, WhatsApp e afins. Esses robôs não rodam JavaScript, então os
      textos ficam no HTML: aqui, em português, e o build traduz a cópia de cada idioma
      (config/prerender.ts). __SITE_URL__ vem de config/site.ts, pelo plugin seo().
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gabriel Maran" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Gabriel Maran · Desenvolvedor Full Stack" />
    <meta
      property="og:description"
      content="Gabriel Maran, Desenvolvedor Full Stack Júnior no Grupo Ítalo."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Gabriel Maran, Desenvolvedor Full Stack Júnior no Grupo Ítalo, ao lado das seis faces resolvidas de um cubo mágico."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Rubik:wght@400;500;700;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
